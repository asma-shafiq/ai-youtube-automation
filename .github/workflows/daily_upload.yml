name: Daily AI Video Upload

on:
  schedule:
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate trending topic
      run: python scripts/trending_topics.py
    
    - name: Generate script
      run: python scripts/generate_script.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    - name: Generate voiceover
      run: python scripts/generate_voiceover.py
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    
    - name: Generate thumbnail
      run: python scripts/generate_thumbnail.py
    
    - name: Upload preparation complete
      run: echo "✅ Video generation pipeline complete"
      if: success()
